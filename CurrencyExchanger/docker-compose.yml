services:
  currencyexchanger:
    build:
      context: .
      dockerfile: CurrencyExchanger/Dockerfile
    container_name: currency-exchanger
    ports:
      - "80:8080"
    environment:
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - dbdata:/app/data
    restart: unless-stopped

volumes:
  dbdata: 
  